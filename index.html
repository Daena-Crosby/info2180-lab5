<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>World Database Lookup</title>		<!-- Stylesheet -->
		<link href="world.css" type="text/css" rel="stylesheet" />

		<script src="world.js" type="text/javascript"></script>
	</head>

	<body>
		<header>
			<h1>World Database Lookup</h1>
			<p style="margin-top: 10px; font-size: 1.1em; opacity: 0.9;">
				Discover countries & cities around the globe! 
			</p>
		</header>

		<main>
			<div id="controls">
				<label for="country">Country:</label>
				<input id="country" type="search" name="country" placeholder="Enter country name..." />
				<button id="lookup">Lookup</button>
				<button id="lookup-cities">Lookup Cities</button>
			</div>
			
			<div id="result">
				<!-- countries/cities will appear here -->
			</div>
		</main>
	</body>
</html>
